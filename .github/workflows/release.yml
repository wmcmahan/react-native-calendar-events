name: Release
# Publishes to npm when release-it pushes a version tag (see CONTRIBUTING.md).
# Authenticates with npm trusted publishing (OIDC): no npm token anywhere.
# One-time setup on npmjs.com: package settings > Trusted Publisher > GitHub,
# owner wmcmahan, repository react-native-calendar-events, workflow release.yml.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  # A tag-push run uses the workflow file at the tagged commit. To publish an
  # existing tag with a fixed workflow, run this manually from the branch.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, e.g. 3.0.0-alpha.1'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read
  id-token: write # lets npm verify this workflow's identity

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout ${{ env.RELEASE_TAG }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Point npm at the public registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Check npm supports trusted publishing (11.5.1+)
        # The npm bundled with the pinned Node is new enough; do not upgrade it,
        # a newer npm may require a newer Node than .nvmrc provides.
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&(b<5||(b===5&&c<1)))) { console.error('npm 11.5.1+ required, found ' + process.argv[1]); process.exit(1) }" "$NPM_VERSION"

      - name: Check the tag matches package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$RELEASE_TAG" ]; then
            echo "Tag $RELEASE_TAG does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Lint, typecheck, unit tests
        run: |
          yarn lint
          yarn typecheck
          yarn test --ci

      - name: Expo plugin and package layout check
        run: yarn test:expo

      - name: Publish
        run: |
          # Prereleases go to their own dist-tag (3.0.0-alpha.1 -> alpha); releases to latest.
          TAG=$(node -p "require('./package.json').version.match(/-([a-z]+)/)?.[1] ?? 'latest'")
          echo "Publishing $RELEASE_TAG to dist-tag $TAG"
          npm publish --provenance --access public --tag "$TAG"
